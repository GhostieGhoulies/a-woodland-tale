<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - A Woodland Tale</title>
  <style>
    body {
      background-color: #2b3a29;
      color: #fdf6e3;
      font-family: Georgia, serif;
      text-align: center;
      padding: 48px 20px;
      margin: 0;
    }
    .card {
      max-width: 460px;
      margin: 0 auto;
      background-color: #3d2c1e;
      border: 2px solid #c9a66b;
      border-radius: 14px;
      padding: 28px 20px;
    }
    h1 {
      color: #f4e4bc;
      margin-top: 0;
    }
    p {
      color: #efe4ce;
      line-height: 1.5;
    }
    button {
      margin-top: 16px;
      background-color: #7c9a5e;
      color: #fdf6e3;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're Offline</h1>
    <p>The woodland path is a little quiet without a connection. Reconnect to the internet and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
